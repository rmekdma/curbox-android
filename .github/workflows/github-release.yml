name: Sign Full Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release version tag (for example v4.1.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign-full-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release version and changelog
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use v<major>.<minor>.<patch> format."
            exit 1
          fi
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts | head -n1)"
          if [[ "$RELEASE_TAG" != "$VERSION_NAME" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match versionName $VERSION_NAME."
            exit 1
          fi
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [[ ! -s "$CHANGELOG" ]]; then
            echo "::error::No changelog at $CHANGELOG."
            exit 1
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4.2.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;29.0.3"

      - name: Build Full Release APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleFullRelease

      - name: Verify Full Release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          META="app/build/outputs/apk/full/release/output-metadata.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --argjson code "$VERSION_CODE" '
            .variantName == "fullRelease" and
            any(.elements[]; .versionCode == $code and (.versionName == $tag or .versionName == ($tag + "-full")))
          ' "$META"

      - name: Sign Full Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app_full
        with:
          releaseDirectory: app/build/outputs/apk/full/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename and verify signed APK
        id: apk
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SIGNED_APK: ${{ steps.sign_app_full.outputs.signedReleaseFile }}
        run: |
          set -euo pipefail
          DEST="curbox-${RELEASE_TAG}-full.apk"
          cp "$SIGNED_APK" "$DEST"
          "$ANDROID_HOME/build-tools/29.0.3/apksigner" verify --verbose --print-certs "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: curbox-${{ inputs.tag }}-full
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
